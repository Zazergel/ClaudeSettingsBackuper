name: Build

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            gradle: ./gradlew
          - os: windows-latest
            name: windows
            gradle: ./gradlew.bat
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run tests
        run: ${{ matrix.gradle }} test --console=plain --no-daemon

      - name: Build app image
        run: ${{ matrix.gradle }} createDistributable --console=plain --no-daemon

      - name: Build MSI installer
        if: runner.os == 'Windows'
        run: ${{ matrix.gradle }} packageMsi --console=plain --no-daemon

      - name: Pack app image (tar.gz)
        if: runner.os == 'Linux'
        run: |
          cd build/compose/binaries/main/app
          tar -czf "$GITHUB_WORKSPACE/ClaudeSettingsBackuper-linux.tar.gz" ClaudeSettingsBackuper

      - name: Pack app image (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/compose/binaries/main/app/ClaudeSettingsBackuper/* -DestinationPath ClaudeSettingsBackuper-windows.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeSettingsBackuper-${{ matrix.name }}
          if-no-files-found: error
          path: |
            ClaudeSettingsBackuper-*.tar.gz
            ClaudeSettingsBackuper-*.zip
            build/compose/binaries/main/*.msi

  release:
    name: Attach artifacts to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
